name: Verify NoteForge
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: noteforge
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: noteforge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U noteforge -d noteforge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get update && sudo apt-get install -y libcairo2 fonts-dejavu-core
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
        working-directory: backend
      - run: ruff check app tests alembic
        working-directory: backend
      - run: pytest -q
        working-directory: backend
        env:
          NOTEFORGE_TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://noteforge:test-only-password@localhost:5432/noteforge_test' || '' }}
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci && npm run build
        working-directory: frontend
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get update && sudo apt-get install -y libcairo2 fonts-dejavu-core
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
        working-directory: backend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python backend/tests/browser/run_e2e.py
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/configure.py --url http://localhost:3000 --http
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 180
      - run: docker compose logs --no-color --tail 100
        if: failure()
      - run: docker compose down --volumes
        if: always()
