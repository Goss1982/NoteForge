[project]
name = "noteforge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.120,<1", "uvicorn[standard]>=0.38,<1", "sqlalchemy>=2.0.44,<3",
  "alembic>=1.17,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.11,<3",
  "python-multipart>=0.0.20,<1", "itsdangerous>=2.2,<3", "openai>=2.6,<3", "httpx[socks]>=0.28,<1",
  "pymupdf>=1.26,<2", "pillow>=12,<13", "rmc==0.3.0", "cairosvg>=2.8,<3"
]
[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "httpx>=0.28,<1", "ruff>=0.14,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
