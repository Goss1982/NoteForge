name: noteforge
x-backend: &backend
  build:
    context: ./backend
  image: noteforge-api:local
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://noteforge:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/noteforge
    DATA_DIR: /data
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
    SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
    PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
    COOKIE_SECURE: ${COOKIE_SECURE:-true}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    RMAPI_CONFIG: /data/remarkable/rmapi.conf
    SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-300}
    AUTO_DOCUMENT_TYPE: ${AUTO_DOCUMENT_TYPE-meeting_minutes}
    MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-40}
    MAX_PAGES: ${MAX_PAGES:-100}
  volumes:
    - notebook-data:/data
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  init: true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: noteforge
      POSTGRES_USER: noteforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U noteforge -d noteforge']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  migrate:
    <<: *backend
    command: [alembic, upgrade, head]
    restart: 'no'
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 5
  worker:
    <<: *backend
    command: [python, -m, app.worker]
    stop_grace_period: 150s
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -m, app.worker_health]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 30s
  web:
    build:
      context: ./frontend
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000'
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}

volumes:
  postgres-data:
  notebook-data:
